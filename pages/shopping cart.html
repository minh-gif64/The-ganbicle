<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your cart - The Ganbicle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/chrome.css">
    <link rel="stylesheet" href="../css/cart.css">
</head>

<body data-page="cart" data-root="../" data-bs-sync>
    <div class="container">
        <h2 class="cart-title">Your cart</h2>

        <div class="table-responsive" id="Table">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-primary text-center">
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="cartRows"></tbody>
            </table>
        </div>

        <div class="box-card text-center" id="cartEmpty" hidden>
            <p class="mb-3">Your cart is empty.</p>
            <a href="shop.html" class="btn btn-primary">Browse the shop</a>
        </div>

        <div class="row g-3 mt-1">
            <div class="col-md-6">
                <div class="box-card h-100">
                    <h5 class="mb-3">Discount code</h5>

                    <div class="input-group mb-3">
                        <input type="text" class="form-control" placeholder="Enter your code" />
                        <button class="btn btn-outline-primary">Apply</button>
                    </div>

                    <a href="shop.html" class="btn btn-outline-secondary w-100">&larr; Continue shopping</a>
                </div>
            </div>

            <div class="col-md-6">
                <div class="box-card h-100">
                    <h5 class="mb-3">Order summary</h5>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="cartSubtotal">$0.00</span>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Shipping fee</span>
                        <span id="cartShip">-</span>
                    </div>

                    <div class="text-muted small mb-2" id="cartShipNote" hidden></div>

                    <hr />

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5 fw-bold">Total</span>
                        <span class="fs-4 fw-bold text-danger" id="cartTotal">$0.00</span>
                    </div>

                    <button class="btn btn-success btn-lg w-100" id="cartCheckout" disabled>Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/common.js"></script>
    <script src="../assets/data.js"></script>
    <script src="../assets/shop.js"></script>
</body>

</html>
