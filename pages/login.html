<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/chrome.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body data-page="login" data-root="../" data-bs-sync>
    <div class="container border rounded-4 mx-auto shadow-sm overflow-hidden" id="login">
        <div class="row">
            <div class = "col-md-6 mx-auto" id = image>
                <h1 class="text-center">The Ganbicle</h1>
                <h2 class ="text-center">Welcome back!</h2>
                <div class="brand-cube" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                    <path d="M12 3.2 4 7.4v9.2l8 4.2 8-4.2V7.4Z"/>
                    <path d="M4 7.4l8 4.2 8-4.2M12 11.6v9.2"/>
                    </svg>
                </div>                
            </div>
            <div class = "col-md-6 mx-auto" id = "form-col">
                <div class="text-center">
                    <h1 class="mb-4">Login</h1>
                </div>
                <form id="loginForm">
                    <div id="loginMsg" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>

                    <label for="email" class="form-label mb-1">Email or Phone Number:</label>
                    <input type="text" id="email" class="form-control mb-3" placeholder="you@example.com" required>

                    <label for="password" class="form-label mb-1">Password:</label>
                    <input type="password" id="password" class="form-control mb-2" placeholder="Password" required>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check mb-0">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="small">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>

                    <hr class="my-3">

                    <p class="text-center small mb-1">New to The Ganbicle?</p>
                    <a href="register.html" class="btn btn-outline-primary w-100">Create an account</a>
                    <p class="text-center small mb-0 mt-3">
                        Sign up and your first order is <strong>10% off</strong>.
                    </p>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/common.js"></script>
    <script src="../assets/data.js"></script>
    <script src="../assets/shop.js"></script>

    <!-- Checks the account saved by register.html. See the note in common.js:
         the browser is checking itself here, so this is a demo, not security. -->
    <script>
    /* already signed in? there is nothing to do here - go to the profile */
    if (isSignedIn()) location.replace('profile.html');

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const box = document.getElementById('loginMsg');
      const say = (text, ok) => {
        box.textContent = text;
        box.className = 'alert py-2 px-3 mb-3 ' + (ok ? 'alert-success' : 'alert-danger');
      };

      const typed = document.getElementById('email').value.trim();
      const pw    = document.getElementById('password').value;
      const user  = getUser();

      if (!user) {
        return say('No account saved in this browser yet. Create one first.', false);
      }
      if (user.contact.toLowerCase() !== typed.toLowerCase()) {
        return say('No account here with that email or number.', false);
      }
      /* hash what was typed with the stored salt and compare hashes,
         because the real password was never saved */
      if (await hashPassword(pw, user.salt) !== user.hash) {
        return say('That password does not match.', false);
      }

      signIn();
      say('Signed in. Welcome back, ' + user.username + '.', true);
      this.querySelector('button[type=submit]').disabled = true;
      setTimeout(() => { location.href = 'profile.html'; }, 1000);
    });
    </script>
</body>
</html>
