<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/chrome.css" />
  <link rel="stylesheet" href="../css/register.css" />
</head>

<body data-page="register" data-root="../" data-bs-sync>
  <div class="container border rounded-4 mx-auto shadow-sm overflow-hidden" id="register-form">
    <div class="row">
      <div class="col-md-6 mx-auto" id=image>
        <h1 class="text-center">The Ganbicle</h1>
        <h2 class="text-center">Create an account to get your first product with a 10% discount!</h2>
        <div class="brand-cube" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 3.2 4 7.4v9.2l8 4.2 8-4.2V7.4Z" />
            <path d="M4 7.4l8 4.2 8-4.2M12 11.6v9.2" />
          </svg>
        </div>
      </div>
      <div class="col-md-6 mx-auto" id="form-col">
        <div class="text-center">
          <h1 class="mb-4">Create Account</h1>
        </div>
        <form id="registerForm">
          <div id="regMsg" class="alert py-2 px-3 mb-3 d-none" role="alert"></div>

          <label for="fname" class="form-label mb-1">Username:</label>
          <input type="text" id="fname" class="form-control mb-3" placeholder="Username" required />

          <label for="identification" class="form-label mb-1">Email or Phone Number:</label>
          <input type="text" id="identification" class="form-control mb-3" placeholder="Email or Phone Number"
            required />

          <label for="password" class="form-label mb-1">Password:</label>
          <input type="password" id="password" class="form-control mb-3" placeholder="Password" required />

          <label for="confirm-password" class="form-label mb-1">Confirm Password:</label>
          <input type="password" id="confirm-password" class="form-control mb-3" placeholder="Confirm Password"
            required />

          <input type="submit" value="Create Account" class="btn btn-primary w-100 btn-lg" />
          <a href="login.html" class="btn btn-link w-100 mt-2">Already have an account? Log in</a>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/common.js"></script>
  <script src="../assets/data.js"></script>
  <script src="../assets/shop.js"></script>

  <!-- Saves the account to localStorage. See the note in common.js: this is a
       demo flow, not security - the browser is checking itself. -->
  <script>
  /* already signed in? there is nothing to do here - go to the profile */
  if (isSignedIn()) location.replace('profile.html');

  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const box = document.getElementById('regMsg');
    const say = (text, ok) => {
      box.textContent = text;
      box.className = 'alert py-2 px-3 mb-3 ' + (ok ? 'alert-success' : 'alert-danger');
    };

    const username = document.getElementById('fname').value.trim();
    const contact  = document.getElementById('identification').value.trim();
    const pw       = document.getElementById('password').value;
    const pw2      = document.getElementById('confirm-password').value;

    if (pw !== pw2)    return say('Those two passwords do not match.', false);
    if (pw.length < 6) return say('Use at least 6 characters for the password.', false);

    const salt = makeSalt();
    setUser({
      username: username,
      contact: contact,
      salt: salt,
      hash: await hashPassword(pw, salt),   /* the password itself is never saved */
      joined: new Date().toISOString()
    });
    signIn();

    say('Account created. Welcome, ' + username + '.', true);
    this.querySelector('input[type=submit]').disabled = true;
    setTimeout(() => { location.href = 'profile.html'; }, 1000);
  });
  </script>
</body>

</html>
